<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDH Calculator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonts -->
    <!-- Kalam -->
    <link href="https://fonts.googleapis.com/css2?family=Delius&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="information">
            <h1>Welcome To <span style="color: rgb(0, 255, 136); font-family: 'Delius'; ">TahaDevHub</span> Calculator</h1>
            <p>Calculate because it's yours...</p>
        </div>
        <div class="calculator">
        <h2 style="text-align: center; font-family: 'Kalam'; letter-spacing: 3px; font-weight: lighter; font-size: x-large;">TDH Calculator</h2>
        <div class="display"><input type="text" readonly></div>
        <div class="keys">
            <div>
                <button class="clear">C</button>
                <button class="operators">&#40;</button>
                <button class="operators">&#41;</button>
                <button class="operators">/</button>
            </div>
            
            <div>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operators">*</button>
            </div>
            
            <div>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operators">-</button>
            </div>
            
            <div>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operators">+</button>
            </div>
            
            <div>
                <button>0</button>
                <button>00</button>
                <button>.</button>
                <button class="equal">=</button>
            </div>
        </div>
    </div>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
